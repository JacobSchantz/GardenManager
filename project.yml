name: GardenManager
options:
  bundleIdPrefix: com.gardenmanager
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

packages:
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: GardenManager/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "563V2QK49N"

targets:
  GardenManager:
    type: application
    platform: iOS
    sources:
      - path: GardenManager
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: MLX
      - package: MLXLM
      - package: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gardenmanager.application
        INFOPLIST_FILE: GardenManager/Info.plist