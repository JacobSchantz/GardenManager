name: GardenManager
options:
  bundleIdPrefix: com.gardenmanager
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

packages:
  SwiftLlama:
    url: https://github.com/pgorzelany/swift-llama-cpp
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: GardenManager/Info.plist
    CODE_SIGN_STYLE: Automatic

targets:
  GardenManager:
    type: application
    platform: iOS
    sources:
      - path: GardenManager
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gardenmanager.application
        INFOPLIST_FILE: GardenManager/Info.plist
        DEVELOPMENT_TEAM: "563V2QK49N"

  GardenManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GardenManagerTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: GardenManager
        embed: false
      - package: SwiftLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gardenmanager.tests
        INFOPLIST_FILE: GardenManagerTests/Info.plist
        DEVELOPMENT_TEAM: "563V2QK49N"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GardenManager.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GardenManager"
        BUNDLE_LOADER: "$(TEST_HOST)"
